name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # v15.5.19paths-ignore on `docs/**` + `**/*.md` was a
  # loophole — markdown-only PRs bypassed the personal-info leakage gate
  #caught HIGH=1 in docs/CHANGELOG-POLICY.md after exactly
  # that loophole let it merge). Now every push/PR runs the full gate
  # matrix. The 3 jobs (cargo, typescript, python) gate themselves
  # internally on changed-files via `paths` filters where it matters.

# Cancel any in-flight run for the same branch/PR on force-push.
# group uses head_ref (PR branch name) for PRs and ref (e.g. refs/heads/main)
# for direct pushes so concurrent main pushes don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Windows-only project. The cockpit hooks, installer and the Tauri build
# all assume PowerShell + Windows APIs, so there's no point matrixing
# macOS / Linux runners. Sticking to windows-latest keeps minutes cheap.
jobs:
  version-drift:
    name: Version drift guard (7 files + markdown bodies must match pyproject SSOT)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run version_propagate.py --check
        # Fails the whole CI run on the first version drift. Reopened 6 times
        # in v15.5.x (PLANS#ci-version-drift-guard). v15.5.15 extended the
        # check to scan markdown bodies (badges + bootstrap URLs + legacy-doc
        # preambles) —caught README drift the file-level check missed.
        run: python scripts/cockpit/version_propagate.py --check

  personal-info-leak:
    name: Personal-info leakage gate (audit_personal_data.py — fail on HIGH)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # audit reads git ls-files; needs the tree
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run audit_personal_data.py
        # v15.5.15wired as a hard gate after the comment sweep
        # brought HIGH findings to 0. MEDIUM findings (persona names like
        # alfred/einstein/etc.) are allowed — they're intentional skill IDs.
        # The scanner exits 1 if ANY HIGH finding exists.
        run: python scripts/cockpit/audit_personal_data.py

  cargo:
    name: Rust (cargo check + clippy)
    runs-on: windows-latest
    # 30 (was 25): the FIRST run after the [profile.test] change below is cold
    # (new fingerprint invalidates the cached target/), and cold runs already
    # graze ~25 min. The extra headroom avoids a false timeout on that single
    # transition run; hot runs land ~7 min so this is slack, not the norm.
    timeout-minutes: 30
    # CARGO_INCREMENTAL=0: in CI (clean tree + restored cache) incremental mode
    # buys nothing and pollutes the fingerprint while bloating the Swatinem
    # cache. Disabling it globally trims the cache restore and the link step.
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      # cat12.5: measured on run #28092264557 (last success, 373s wall-clock,
      # job=366s) the two biggest single line items inside THIS job were:
      # (a) tar-extracting the ~2.3 GB Swatinem cache = 96s, and (b) cargo's
      # "Updating crates.io index" network round-trip = 68s, done twice
      # (once per cargo invocation) for zero reason on an exact cache hit.
      # Windows Defender's real-time scanner re-inspects every file the tar
      # extraction and the compiler/linker write under this workspace and
      # under CARGO_HOME -- excluding both paths is the standard, widely
      # documented windows-latest fix for AV-scan-bound CI (checkout/cache-
      # restore/link are almost pure file I/O). Wrapped in try/catch so a
      # runner-image policy change degrades to "no speedup", never to a red
      # job -- this step cannot fail the gate.
      - name: Exclude workspace + CARGO_HOME from Windows Defender real-time scan
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
            Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction Stop
            Write-Host "Defender exclusions added for workspace + CARGO_HOME."
          } catch {
            Write-Host "Defender exclusion skipped (unsupported on this runner): $($_.Exception.Message)"
          }

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        # cache-on-failure: true ensures fastembed/ort artefacts built during
        # a clippy-failing run are still stored, so the next push (fix commit)
        # doesn't start from zero.  shared-key pins the cache to this job so
        # the key is stable across Cargo.lock-only changes (Swatinem already
        # appends the lock hash as a suffix).
        # cat12.5 NOTE: do NOT wire cache-hit -> CARGO_NET_OFFLINE. Tried on
        # run #28608208137: exact hit + offline broke with "no matching
        # package named `base64` found" -- rust-cache PRUNES the registry on
        # save, so a restored cache is NOT self-sufficient for --offline.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-center/src-tauri
          cache-on-failure: true
          shared-key: cargo-test-profile

      - name: cargo clippy (compiles + lints; -D warnings = gate duro)
        # --profile test makes clippy compile with the same rustc flags as
        # `cargo test` (the `test` profile, not `dev`).  Without this, clippy
        # uses profile `dev` and `cargo test` recompiles fastembed/ort from
        # scratch under profile `test` — that's the ~10 min recompilation
        # even though Swatinem cached `target/`.  Aligning both steps to the
        # same profile means the second step finds every artefact hot and only
        # spends the ~9 s actually running tests.
        # --lib --bins mirrors what `cargo test` tests so clippy's scope is
        # identical — avoids compiling integration-test stubs that cargo test
        # doesn't use (those live under tests/ and require a live Qdrant).
        working-directory: control-center/src-tauri
        run: cargo clippy --lib --bins --profile test -- -D warnings

      - name: cargo test (unit, lib only)
        # clippy --profile test above already compiled the DEPS (fastembed/ort/
        # tauri) hot, but clippy only *checks* the local crate (emits .rmeta) —
        # it does NOT codegen+link the test-harness binary. So this step still
        # pays the codegen+link of the local crate (~237 s hot for the 509
        # tests, not the ~9 s an earlier comment wrongly claimed). The
        # [profile.test] tuning in Cargo.toml (debug=0 → no PDB, codegen-units
        # =16) shaves that link cost. --profile test is the cargo-test default;
        # stated explicitly so it visibly shares the profile (and its tuning)
        # with the clippy step.
        #
        # cat12: dropped `--bins` here. The ultron-memory bin
        # carries NO `#[test]` (verified: it runs 0 tests), so `--bins` only
        # added an extra heavy LINK step (links fastembed/ort/tauri) for
        # zero coverage. clippy above still compiles+lints `--lib --bins`, so the
        # bin is still gated for compilation — only its redundant test-link
        # is gone. Trims the Rust job toward the <300 s target without losing any
        # assertion. tests/ stay excluded (they need a live Qdrant/sidecar).
        working-directory: control-center/src-tauri
        run: cargo test --lib --profile test

  typescript:
    name: TypeScript (tsc --noEmit)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Not on the critical path for cat12.5 (this job measured 110s vs the
      # cargo job's 366s on run #28092264557) -- added for consistency/
      # headroom as node_modules grows, same no-fail guard as the cargo job.
      - name: Exclude workspace from Windows Defender real-time scan
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
            Write-Host "Defender exclusion added for workspace."
          } catch {
            Write-Host "Defender exclusion skipped (unsupported on this runner): $($_.Exception.Message)"
          }

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-center/package-lock.json

      - name: Install dependencies
        working-directory: control-center
        run: npm ci

      - name: Type-check
        working-directory: control-center
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        # Previously tsc-only: the 29 vitest specs never ran in CI. Now they
        # gate the merge like the Rust tests.
        working-directory: control-center
        run: npm test

  routing-dispatcher:
    name: Routing dispatcher loads (syntax + require chain)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # 2.5(b): hasta hoy CI NO validaba NADA del dispatcher de skills, así que un
    # v2/v3 roto (sintaxis o un require movido — p.ej. el cliente del daemon E5
    # que v3 importa) dejaba el hook UserPromptSubmit muerto y TODOS los prompts
    # sin routing, en silencio. Dos gates PORTABLES (no tocan ~/.claude del
    # usuario): (1) la cadena del dispatcher carga; (2) accuracy@3 == 100% sobre
    # los 21 casos representativos. El acc@3 es e2e y determinista porque esos
    # casos resuelven de las tablas PERSONAS/PLUGINS/AGENTS de v2 (verificado:
    # 21/21 con un árbol de descubrimiento VACÍO), así que ULTRON_ROUTING_FIXTURES
    # apuntando a un dir vacío hace el harness portable sin fixtures de skills.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Dispatcher loads (syntax + require chain)
        run: |
          node --check cockpit/skill-lazy/routing-dispatcher.v2.js
          node --check cockpit/skill-lazy/routing-dispatcher.v3.js
          node --check hooks/scripts/lib/ultron-memory-cli.js
          node -e "require('./cockpit/skill-lazy/routing-dispatcher.v2.js'); require('./cockpit/skill-lazy/routing-dispatcher.v3.js'); require('./hooks/scripts/lib/ultron-memory-cli.js'); console.log('routing dispatcher require chain OK');"
      - name: accuracy@3 gate (deterministic table-based ranker)
        run: |
          # _accuracy_at3.js exits 1 if acc@3 < 100% -> a ranker regression fails
          # CI. ULTRON_ROUTING_FIXTURES at an empty dir makes the candidate
          # discovery (normally ~/.claude/skills + ECC cache) portable, while the
          # 21 representative cases still resolve from v2's hardcoded tables.
          mkdir -p "${RUNNER_TEMP}/ultron-route-fixtures"
          ULTRON_ROUTING_FIXTURES="${RUNNER_TEMP}/ultron-route-fixtures" node cockpit/skill-lazy/_accuracy_at3.js

  # NOTE: the legacy `python` job (uv sync + `uv run pytest tests/`) was
  # removed during the 2026-06-04 cleanup. The 15.x Python test suite that
  # lived in `tests/` has been archived to `_legacy_archive/tests-python-15x/`
  # and is no longer part of the runtime, so the job had no `tests/` directory
  # to run and would fail on every push. The two remaining Python gates that
  # still matter — version-drift and personal-info-leak — run as their own
  # jobs above and are unaffected.
