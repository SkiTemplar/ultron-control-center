name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # v15.5.19paths-ignore on `docs/**` + `**/*.md` was a
  # loophole — markdown-only PRs bypassed the personal-info leakage gate
  #caught HIGH=1 in docs/CHANGELOG-POLICY.md after exactly
  # that loophole let it merge). Now every push/PR runs the full gate
  # matrix. The 3 jobs (cargo, typescript, python) gate themselves
  # internally on changed-files via `paths` filters where it matters.

# Windows-only project. The cockpit hooks, installer and the Tauri build
# all assume PowerShell + Windows APIs, so there's no point matrixing
# macOS / Linux runners. Sticking to windows-latest keeps minutes cheap.
jobs:
  version-drift:
    name: Version drift guard (7 files + markdown bodies must match pyproject SSOT)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run version_propagate.py --check
        # Fails the whole CI run on the first version drift. Reopened 6 times
        # in v15.5.x (PLANS#ci-version-drift-guard). v15.5.15 extended the
        # check to scan markdown bodies (badges + bootstrap URLs + legacy-doc
        # preambles) —caught README drift the file-level check missed.
        run: python scripts/cockpit/version_propagate.py --check

  personal-info-leak:
    name: Personal-info leakage gate (audit_personal_data.py — fail on HIGH)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # audit reads git ls-files; needs the tree
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run audit_personal_data.py
        # v15.5.15wired as a hard gate after the comment sweep
        # brought HIGH findings to 0. MEDIUM findings (persona names like
        # alfred/einstein/etc.) are allowed — they're intentional skill IDs.
        # The scanner exits 1 if ANY HIGH finding exists.
        run: python scripts/cockpit/audit_personal_data.py

  cargo:
    name: Rust (cargo check + clippy)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-center/src-tauri

      - name: cargo check
        working-directory: control-center/src-tauri
        run: cargo check --all-targets

      - name: cargo clippy (warnings allowed, errors block)
        working-directory: control-center/src-tauri
        run: cargo clippy --all-targets -- -A warnings

      - name: cargo test (unit + bins)
        # The gate was previously decorative: check + clippy compiled the
        # tests but never RAN them, so a broken test merged green. Now the
        # unit + bin tests actually execute. Integration tests under tests/
        # that need a live Qdrant/sidecar are intentionally excluded (--lib
        # --bins) so CI stays hermetic.
        working-directory: control-center/src-tauri
        run: cargo test --lib --bins

  typescript:
    name: TypeScript (tsc --noEmit)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-center/package-lock.json

      - name: Install dependencies
        working-directory: control-center
        run: npm ci

      - name: Type-check
        working-directory: control-center
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        # Previously tsc-only: the 29 vitest specs never ran in CI. Now they
        # gate the merge like the Rust tests.
        working-directory: control-center
        run: npm test

  # NOTE: the legacy `python` job (uv sync + `uv run pytest tests/`) was
  # removed during the 2026-06-04 cleanup. The 15.x Python test suite that
  # lived in `tests/` has been archived to `_legacy_archive/tests-python-15x/`
  # and is no longer part of the runtime, so the job had no `tests/` directory
  # to run and would fail on every push. The two remaining Python gates that
  # still matter — version-drift and personal-info-leak — run as their own
  # jobs above and are unaffected.
