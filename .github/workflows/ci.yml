name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'AUTHORS.md'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'AUTHORS.md'
      - 'NOTICE'

# Windows-only project. The cockpit hooks, installer and the Tauri build
# all assume PowerShell + Windows APIs, so there's no point matrixing
# macOS / Linux runners. Sticking to windows-latest keeps minutes cheap.
jobs:
  cargo:
    name: Rust (cargo check + clippy)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-center/src-tauri

      - name: cargo check
        working-directory: control-center/src-tauri
        run: cargo check --all-targets

      - name: cargo clippy (warnings allowed, errors block)
        working-directory: control-center/src-tauri
        run: cargo clippy --all-targets -- -A warnings

  typescript:
    name: TypeScript (tsc --noEmit)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-center/package-lock.json

      - name: Install dependencies
        working-directory: control-center
        run: npm ci

      - name: Type-check
        working-directory: control-center
        run: npx tsc --noEmit

  python:
    name: Python (uv sync + pytest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        # setup-uv@v6 supports Node 24; enable-cache disabled because v6
        # sometimes returns 400 on first run for new repos.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync
        continue-on-error: false

      - name: Run tests
        # The excluded files assume a fully-provisioned local user environment
        # (existing ~/.ultron-vault state, an installed weekly-backup task,
        # a populated shared-duet history, real PII paths in the cockpit
        # session log). They pass on the maintainer's box but cannot run
        # against a fresh checkout. The other 940+ tests run in CI.
        # TODO: add @pytest.mark.requires_local_env to each affected test
        # and switch to that marker instead of file-level ignores.
        run: >
          uv run pytest tests/ -q --tb=short
          --ignore=tests/test_multimodel.py
          --ignore=tests/test_auto_recall.py
          --ignore=tests/test_backup_watch.py
          --ignore=tests/test_meta_prompter.py
        env:
          ULTRON_HOME: ${{ github.workspace }}
