name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Disparo manual (cat12): re-medir la duracion del job Rust con cache
  # caliente sin necesidad de un commit vacio (gh workflow run ci.yml).
  workflow_dispatch:
  # v15.5.19paths-ignore on `docs/**` + `**/*.md` was a
  # loophole — markdown-only PRs bypassed the personal-info leakage gate
  #caught HIGH=1 in docs/CHANGELOG-POLICY.md after exactly
  # that loophole let it merge). Now every push/PR runs the full gate
  # matrix. The 3 jobs (cargo, typescript, python) gate themselves
  # internally on changed-files via `paths` filters where it matters.

# Cancel any in-flight run for the same branch/PR on force-push.
# group uses head_ref (PR branch name) for PRs and ref (e.g. refs/heads/main)
# for direct pushes so concurrent main pushes don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Windows-only project. The cockpit hooks, installer and the Tauri build
# all assume PowerShell + Windows APIs, so there's no point matrixing
# macOS / Linux runners. Sticking to windows-latest keeps minutes cheap.
jobs:
  version-drift:
    name: Version drift guard (7 files + markdown bodies must match pyproject SSOT)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run version_propagate.py --check
        # Fails the whole CI run on the first version drift. Reopened 6 times
        # in v15.5.x (PLANS#ci-version-drift-guard). v15.5.15 extended the
        # check to scan markdown bodies (badges + bootstrap URLs + legacy-doc
        # preambles) —caught README drift the file-level check missed.
        run: python scripts/cockpit/version_propagate.py --check

  personal-info-leak:
    name: Personal-info leakage gate (audit_personal_data.py — fail on HIGH)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # audit reads git ls-files; needs the tree
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run audit_personal_data.py
        # v15.5.15wired as a hard gate after the comment sweep
        # brought HIGH findings to 0. MEDIUM findings (persona names like
        # alfred/einstein/etc.) are allowed — they're intentional skill IDs.
        # The scanner exits 1 if ANY HIGH finding exists.
        run: python scripts/cockpit/audit_personal_data.py

  # cat12.5 split: el job Rust unico encadenaba clippy (~242s) y test (~201s)
  # EN SERIE (~443s de wall caliente), fuera del criterio <300s del check 12.5
  # (que mide updatedAt-createdAt del ultimo run success). Partido en dos jobs
  # paralelos el wall queda en max(job) ~190-260s. No re-fusionar. Cada job
  # lleva su PROPIO cache Swatinem (shared-key distinto: sus target/ divergen —
  # clippy solo emite .rmeta del crate local, test paga codegen+link del
  # harness) y AMBOS llevan el cache ort-dfbin porque fastembed/ort compila en
  # los dos. Cuota: los dos caches cargo suman ~4GB sobre los 10GB del repo
  # (publish-tauri usa ~1.5GB) — aceptado en la decision.
  cargo-clippy:
    name: Rust (cargo clippy)
    runs-on: windows-latest
    # 30: un run frio (shared-key recien estrenado o fingerprint invalidado)
    # roza ~25 min compilando fastembed/ort/tauri desde cero; en caliente el
    # job queda ~4 min. Holgura, no la norma.
    timeout-minutes: 30
    # CARGO_INCREMENTAL=0: in CI (clean tree + restored cache) incremental mode
    # buys nothing and pollutes the fingerprint while bloating the Swatinem
    # cache. Disabling it globally trims the cache restore and the link step.
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      # cat12.5: measured on run #28092264557 (last success of the PRE-SPLIT
      # single Rust job, 373s wall-clock, job=366s) the two biggest single line
      # items were: (a) tar-extracting the ~2.3 GB Swatinem cache = 96s, and
      # (b) cargo's "Updating crates.io index" network round-trip = 68s, done
      # twice (once per cargo invocation) for zero reason on an exact cache hit.
      # Windows Defender's real-time scanner re-inspects every file the tar
      # extraction and the compiler/linker write under this workspace and
      # under CARGO_HOME -- excluding both paths is the standard, widely
      # documented windows-latest fix for AV-scan-bound CI (checkout/cache-
      # restore/link are almost pure file I/O). Wrapped in try/catch so a
      # runner-image policy change degrades to "no speedup", never to a red
      # job -- this step cannot fail the gate.
      - name: Exclude workspace + CARGO_HOME from Windows Defender real-time scan
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
            Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction Stop
            Write-Host "Defender exclusions added for workspace + CARGO_HOME."
          } catch {
            Write-Host "Defender exclusion skipped (unsupported on this runner): $($_.Exception.Message)"
          }

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        # cache-on-failure: true ensures fastembed/ort artefacts built during
        # a clippy-failing run are still stored, so the next push (fix commit)
        # doesn't start from zero.  shared-key pins the cache to this job so
        # the key is stable across Cargo.lock-only changes (Swatinem already
        # appends the lock hash as a suffix).
        # cat12.5 NOTE: do NOT wire cache-hit -> CARGO_NET_OFFLINE. Tried on
        # run #28608208137: exact hit + offline broke with "no matching
        # package named `base64` found" -- rust-cache PRUNES the registry on
        # save, so a restored cache is NOT self-sufficient for --offline.
        # save-if job.status!=cancelled: un run CANCELADO (cancel-in-progress en rafagas
        # de release) guardaba un target/ PARCIAL bajo la primary key nueva del
        # Cargo.lock; como los caches de GH son inmutables y rust-cache no
        # re-guarda tras "full match", ese veneno era permanente (run #29653454511
        # guardo 169MB parciales -> el success posterior recompilo 676 crates,
        # 511s). cache-on-failure sigue cubriendo fallos reales de clippy/test.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-center/src-tauri
          cache-on-failure: true
          save-if: ${{ job.status != 'cancelled' }}
          shared-key: cargo-clippy-profile

      - name: Cache ONNX Runtime prebuilt (ort-sys dfbin)
        # CI ROJO 2026-07-02 root-cause: ort-sys (via fastembed) descarga la lib
        # estatica onnxruntime a %LOCALAPPDATA%\dfbin — fuera de target/ y de
        # ~/.cargo, asi que NINGUN cache la preservaba — y su build script no
        # emite rerun-if-changed sobre ese dir. rust-cache restauraba target/
        # con el output del build script apuntando al path absoluto de OTRA VM
        # -> en la VM fresca no existe -> rustc: "could not find native static
        # library onnxruntime" en cuanto algo fuerza recompilar ort-sys. Cachear
        # dfbin lo resucita en el MISMO path absoluto (el usuario runneradmin es
        # fijo en windows-latest), y el -L restaurado vuelve a ser valido.
        # Key COMPARTIDA con cargo-test a proposito (mismo contenido, ahorra
        # cuota); en un miss ambos jobs intentan guardar y el segundo recibe un
        # warning inocuo de "cache already exists", no es fallo.
        id: ort-dfbin
        uses: actions/cache@v4
        with:
          # Path REAL verificado contra el vendored dirs.rs de ort-sys y el disco
          # local: cache_dir() = %LOCALAPPDATA%\ort.pyke.io (PYKE_ROOT) y dfbin
          # cuelga DE AHI — cachear ~/AppData/Local/dfbin a secas nunca salvaba
          # nada ("Path Validation Error" en runs 28653104441/28655076253; el
          # verde venia del self-heal re-descargando). Forward slashes: con `~\`
          # actions/cache tampoco expande el home.
          path: ~/AppData/Local/ort.pyke.io/dfbin
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('control-center/src-tauri/Cargo.lock') }}

      - name: Self-heal ort-sys on dfbin cache miss
        # Sin dfbin restaurado, el fingerprint "fresh" del build script de
        # ort-sys es veneno permanente: la clave de rust-cache ya existe (las
        # caches de GH son inmutables) y nunca se re-guarda saneada. Purgar
        # build/ + .fingerprint/ de ort-sys fuerza el re-run del build script,
        # que re-descarga onnxruntime a ESTA VM -> -L valido. Solo corre en
        # miss (primera vez o Cargo.lock nuevo); en hit el paso anterior ya
        # dejo vivo el path y no se recompila nada.
        if: steps.ort-dfbin.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # OJO: Get-ChildItem con wildcard en -Path + -Filter devuelve VACIO
          # (no-op silencioso, verificado en local 2026-07-03) — enumerar los
          # dirs de perfil explicitamente y contar lo borrado.
          $purged = 0
          $target = "control-center\src-tauri\target"
          foreach ($profileDir in (Get-ChildItem $target -Directory -ErrorAction SilentlyContinue)) {
            foreach ($sub in @("build", ".fingerprint")) {
              $p = Join-Path $profileDir.FullName $sub
              if (Test-Path $p) {
                $hits = Get-ChildItem $p -Directory -Filter "ort-sys-*"
                $purged += @($hits).Count
                $hits | Remove-Item -Recurse -Force
              }
            }
          }
          Write-Host "ort-sys purge: $purged dir(s) eliminados (0 = target frio, tambien valido)."

      - name: cargo clippy (compiles + lints; -D warnings = gate duro)
        # --profile test: herencia del job pre-split, donde alineaba los rustc
        # flags de clippy con los de `cargo test` para compartir target/. Con
        # los jobs separados se CONSERVA a proposito: el [profile.test] tuning
        # de Cargo.toml (debug=0 -> sin PDB, codegen-units=16) compila mas
        # barato que `dev`, y cambiar el profile invalidaria el universo de
        # artefactos ya cacheado/medido.
        # --lib --bins mirrors what `cargo test` tests so clippy's scope is
        # identical — avoids compiling integration-test stubs that cargo test
        # doesn't use (those live under tests/ and require a live Qdrant).
        working-directory: control-center/src-tauri
        run: cargo clippy --lib --bins --profile test -- -D warnings

  cargo-test:
    name: Rust (cargo test)
    runs-on: windows-latest
    # 30: mismo razonamiento que cargo-clippy — frio ~25 min, caliente ~4 min.
    timeout-minutes: 30
    # CARGO_INCREMENTAL=0: mismo razonamiento que en cargo-clippy.
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      # Misma exclusion que en cargo-clippy (medicion cat12.5 alli): el tar del
      # cache Swatinem y el codegen+link del harness de tests son I/O puro que
      # Defender re-escanea. try/catch: este step no puede poner el gate rojo.
      - name: Exclude workspace + CARGO_HOME from Windows Defender real-time scan
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
            Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo" -ErrorAction Stop
            Write-Host "Defender exclusions added for workspace + CARGO_HOME."
          } catch {
            Write-Host "Defender exclusion skipped (unsupported on this runner): $($_.Exception.Message)"
          }

      - name: Checkout
        uses: actions/checkout@v5

      # Sin components: clippy — este job solo compila y ejecuta los tests.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        # shared-key cargo-test-profile ES la key del job Rust pre-split: el
        # primer run post-split restaura ese cache caliente tal cual (el de
        # cargo-clippy si arranca frio, una sola vez).
        # cache-on-failure + save-if job.status!=cancelled son OBLIGATORIOS aqui igual
        # que en cargo-clippy — historia completa (veneno del run cancelado
        # #29653454511; y NO cablear cache-hit -> CARGO_NET_OFFLINE, roto en
        # run #28608208137) en el step homologo de cargo-clippy.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-center/src-tauri
          cache-on-failure: true
          save-if: ${{ job.status != 'cancelled' }}
          shared-key: cargo-test-profile

      - name: Cache ONNX Runtime prebuilt (ort-sys dfbin)
        # Necesario tambien aqui: fastembed/ort compila en ambos jobs Rust.
        # Historia completa (CI ROJO 2026-07-02, path PYKE_ROOT verificado,
        # key compartida entre jobs) en el step homologo de cargo-clippy.
        id: ort-dfbin
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/ort.pyke.io/dfbin
          key: ort-dfbin-${{ runner.os }}-${{ hashFiles('control-center/src-tauri/Cargo.lock') }}

      - name: Self-heal ort-sys on dfbin cache miss
        # Mismo self-heal que en cargo-clippy (razonamiento completo alli):
        # sin dfbin, purgar build/ + .fingerprint/ de ort-sys fuerza el re-run
        # del build script que re-descarga onnxruntime a ESTA VM.
        if: steps.ort-dfbin.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # OJO: Get-ChildItem con wildcard en -Path + -Filter devuelve VACIO
          # (no-op silencioso, verificado en local 2026-07-03) — enumerar los
          # dirs de perfil explicitamente y contar lo borrado.
          $purged = 0
          $target = "control-center\src-tauri\target"
          foreach ($profileDir in (Get-ChildItem $target -Directory -ErrorAction SilentlyContinue)) {
            foreach ($sub in @("build", ".fingerprint")) {
              $p = Join-Path $profileDir.FullName $sub
              if (Test-Path $p) {
                $hits = Get-ChildItem $p -Directory -Filter "ort-sys-*"
                $purged += @($hits).Count
                $hits | Remove-Item -Recurse -Force
              }
            }
          }
          Write-Host "ort-sys purge: $purged dir(s) eliminados (0 = target frio, tambien valido)."

      - name: cargo test (unit, lib only)
        # El coste real de este job es el codegen+link del binario del
        # test-harness del crate local (~237 s hot para los 509 tests): el
        # cache restaura las DEPS (fastembed/ort/tauri) calientes, pero ese
        # link siempre se paga. El [profile.test] tuning de Cargo.toml
        # (debug=0 -> sin PDB, codegen-units=16) lo recorta. --profile test es
        # el default de cargo test; explicito para que se vea que comparte
        # profile (y tuning) con el job cargo-clippy.
        #
        # cat12: dropped `--bins` here. The ultron-memory bin
        # carries NO `#[test]` (verified: it runs 0 tests), so `--bins` only
        # added an extra heavy LINK step (links fastembed/ort/tauri) for
        # zero coverage. The cargo-clippy job still compiles+lints `--lib --bins`,
        # so the bin is still gated for compilation — only its redundant
        # test-link is gone. Trims the Rust wall toward the <300 s target without
        # losing any assertion. tests/ stay excluded (they need a live Qdrant/sidecar).
        working-directory: control-center/src-tauri
        run: cargo test --lib --profile test

  typescript:
    name: TypeScript (tsc --noEmit)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Not on the critical path for cat12.5 (this job measured 110s vs the
      # cargo job's 366s on run #28092264557) -- added for consistency/
      # headroom as node_modules grows, same no-fail guard as the cargo job.
      - name: Exclude workspace from Windows Defender real-time scan
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
            Write-Host "Defender exclusion added for workspace."
          } catch {
            Write-Host "Defender exclusion skipped (unsupported on this runner): $($_.Exception.Message)"
          }

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-center/package-lock.json

      - name: Install dependencies
        working-directory: control-center
        run: npm ci

      - name: Type-check
        working-directory: control-center
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        # Previously tsc-only: the 29 vitest specs never ran in CI. Now they
        # gate the merge like the Rust tests.
        working-directory: control-center
        run: npm test

  routing-dispatcher:
    name: Routing dispatcher loads (syntax + require chain)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # 2.5(b): hasta hoy CI NO validaba NADA del dispatcher de skills, así que un
    # v2/v3 roto (sintaxis o un require movido — p.ej. el cliente del daemon E5
    # que v3 importa) dejaba el hook UserPromptSubmit muerto y TODOS los prompts
    # sin routing, en silencio. Dos gates PORTABLES (no tocan ~/.claude del
    # usuario): (1) la cadena del dispatcher carga; (2) accuracy@3 == 100% sobre
    # los 21 casos representativos. El acc@3 es e2e y determinista porque esos
    # casos resuelven de las tablas PERSONAS/PLUGINS/AGENTS de v2 (verificado:
    # 21/21 con un árbol de descubrimiento VACÍO), así que ULTRON_ROUTING_FIXTURES
    # apuntando a un dir vacío hace el harness portable sin fixtures de skills.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Dispatcher loads (syntax + require chain)
        run: |
          node --check cockpit/skill-lazy/routing-dispatcher.v2.js
          node --check cockpit/skill-lazy/routing-dispatcher.v3.js
          node --check hooks/scripts/lib/ultron-memory-cli.js
          node -e "require('./cockpit/skill-lazy/routing-dispatcher.v2.js'); require('./cockpit/skill-lazy/routing-dispatcher.v3.js'); require('./hooks/scripts/lib/ultron-memory-cli.js'); console.log('routing dispatcher require chain OK');"
      - name: accuracy@3 gate (deterministic table-based ranker)
        run: |
          # _accuracy_at3.js exits 1 if acc@3 < 100% -> a ranker regression fails
          # CI. ULTRON_ROUTING_FIXTURES at an empty dir makes the candidate
          # discovery (normally ~/.claude/skills + ECC cache) portable, while the
          # 21 representative cases still resolve from v2's hardcoded tables.
          mkdir -p "${RUNNER_TEMP}/ultron-route-fixtures"
          ULTRON_ROUTING_FIXTURES="${RUNNER_TEMP}/ultron-route-fixtures" node cockpit/skill-lazy/_accuracy_at3.js

  hook-selftests:
    name: Hook & script selftests (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # (2026-08-10, higiene bloque 7) Estos selftests existían pero JAMÁS
    # corrían en CI — una regresión en los hooks de memoria/captura pasaba en
    # silencio. Solo los HERMÉTICOS (verificado con HOME falso en limpio):
    # kirkardo-eval.selftest.mjs queda FUERA a propósito — su run scoped
    # necesita el ~/.ultron real (brain.db, logs) y en un runner limpio falla
    # por entorno, no por regresión.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Script selftests (memoria / captura / lifecycle)
        run: |
          node scripts/memory-bench.selftest.mjs
          node scripts/posttoolfail-capture.selftest.mjs
          node scripts/subagent-harvest.selftest.mjs
          node scripts/subagent-lifecycle.selftest.mjs
          node hooks/scripts/kanban-update-reminder.selftest.mjs
      - name: Hook selftests (resume - frescura + calidad)
        run: |
          node hooks/scripts/tests/test-freshness-gate.js
          node hooks/scripts/tests/test-resume-quality.js

  # NOTE: the legacy `python` job (uv sync + `uv run pytest tests/`) was
  # removed during the 2026-06-04 cleanup. The 15.x Python test suite that
  # lived in `tests/` has been archived to `_legacy_archive/tests-python-15x/`
  # and is no longer part of the runtime, so the job had no `tests/` directory
  # to run and would fail on every push. The two remaining Python gates that
  # still matter — version-drift and personal-info-leak — run as their own
  # jobs above and are unaffected.
