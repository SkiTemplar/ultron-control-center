name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # v15.5.19paths-ignore on `docs/**` + `**/*.md` was a
  # loophole — markdown-only PRs bypassed the personal-info leakage gate
  #caught HIGH=1 in docs/CHANGELOG-POLICY.md after exactly
  # that loophole let it merge). Now every push/PR runs the full gate
  # matrix. The 3 jobs (cargo, typescript, python) gate themselves
  # internally on changed-files via `paths` filters where it matters.

# Windows-only project. The cockpit hooks, installer and the Tauri build
# all assume PowerShell + Windows APIs, so there's no point matrixing
# macOS / Linux runners. Sticking to windows-latest keeps minutes cheap.
jobs:
  version-drift:
    name: Version drift guard (7 files + markdown bodies must match pyproject SSOT)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run version_propagate.py --check
        # Fails the whole CI run on the first version drift. Reopened 6 times
        # in v15.5.x (PLANS#ci-version-drift-guard). v15.5.15 extended the
        # check to scan markdown bodies (badges + bootstrap URLs + legacy-doc
        # preambles) —caught README drift the file-level check missed.
        run: python scripts/cockpit/version_propagate.py --check

  personal-info-leak:
    name: Personal-info leakage gate (audit_personal_data.py — fail on HIGH)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # audit reads git ls-files; needs the tree
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run audit_personal_data.py
        # v15.5.15wired as a hard gate after the comment sweep
        # brought HIGH findings to 0. MEDIUM findings (persona names like
        # alfred/einstein/etc.) are allowed — they're intentional skill IDs.
        # The scanner exits 1 if ANY HIGH finding exists.
        run: python scripts/cockpit/audit_personal_data.py

  cargo:
    name: Rust (cargo check + clippy)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-center/src-tauri

      - name: cargo check
        working-directory: control-center/src-tauri
        run: cargo check --all-targets

      - name: cargo clippy (warnings allowed, errors block)
        working-directory: control-center/src-tauri
        run: cargo clippy --all-targets -- -A warnings

  typescript:
    name: TypeScript (tsc --noEmit)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-center/package-lock.json

      - name: Install dependencies
        working-directory: control-center
        run: npm ci

      - name: Type-check
        working-directory: control-center
        run: npx tsc --noEmit

  python:
    name: Python (uv sync + pytest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        # setup-uv@v6 supports Node 24; enable-cache disabled because v6
        # sometimes returns 400 on first run for new repos.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync
        continue-on-error: false

      # Many cockpit scripts and tests resolve paths via
      # os.path.expanduser("~/.ultron/...") rather than honouring an env
      # var. On a CI runner ~ is C:\Users\runneradmin and that path is
      # empty, so 160+ tests fail with FileNotFoundError on real repo
      # files like config/skills-manifest-schema.json. Fix: create a
      # junction (NTFS hardlink at directory level — zero copy, atomic)
      # that points ~/.ultron at the checkout. Tests then see the
      # canonical layout they expect. Junctions persist for the job
      # only because the runner is ephemeral.
      - name: Link workspace as ~/.ultron
        shell: pwsh
        run: |
          $target = Join-Path $env:USERPROFILE ".ultron"
          if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
          }
          New-Item -ItemType Junction -Path $target -Target "$env:GITHUB_WORKSPACE" | Out-Null
          Write-Host "Linked $target -> $env:GITHUB_WORKSPACE"

      - name: Run tests
        # v15.5.21: test_multimodel.py, test_meta_prompter.py and
        # test_telemetry_written were un-ignored once their underlying bugs
        # were fixed — the CI now runs them for real.
        # test_auto_recall.py and test_backup_watch.py still assume a
        # fully-provisioned local environment (installed weekly-backup
        # scheduled task, kill-switch state) that a fresh runner cannot
        # offer even with the junction above. The other 900+ tests run
        # unchanged.
        # TODO: add @pytest.mark.requires_local_env to the 2 remaining
        # files and switch to that marker instead of file-level ignores.
        run: >
          uv run pytest tests/ -q --tb=short
          --ignore=tests/test_auto_recall.py
          --ignore=tests/test_backup_watch.py
