# ULTRON v14 GENESIS — Trusted source whitelist + per-skill exception waivers.
#
# Skills loaded from a trusted source get one severity downgrade
# (warn -> allow, quarantine -> warn) but `block` is NEVER overridden
# by source trust alone — only by an explicit waiver below.
#
# `local_skill_root` is always trusted (USER's personal skills).
schema_version: "1"
trusted_sources:
  - "anthropics"
  - "addyosmani"
  - "obra"
  - "claude-code-plugins"
  - "agent-skills@addy-agent-skills"
  - "claude-plugins-official"
  - "superpowers-marketplace"
  - "awesome-claude-code-subagents"  # VoltAgent MIT collection (audited 2026-05-07, 0 malicious)
local_skill_root: "C:/Users/USER/.ultron/skills"

# Bulk waivers applied to ALL skills loaded from trusted_sources above.
# These are by-design patterns in legitimate skill bundles (system prompt
# templates, tool reference lists) that the strict scanner flags as warn.
# Restricted to warn-class rules — block-class still requires per-skill
# explicit waivers under `exceptions:` below.
trusted_source_waivers:
  - "PI012"  # embedded_system_prompt — community skills carry their own role prompt
  - "PI009"  # untrusted_dangerous_tool:Write/Edit/Bash — tool refs in skill docs

# Per-skill, per-rule waivers. Each waiver is bound to a specific SKILL.md
# sha1 — modifying the file invalidates the waiver, forcing a fresh review.
# Audits surface waived findings (decision drops them; report keeps them).
#
# When a skill is added or its content changes legitimately, re-compute the
# sha1 and update the entry below. This is the trade-off for treating SHA1
# as drift-detection (acceptable in a non-adversarial home-system context).
#
# KNOWN-NOISE (2026-05-09): ~165 skills from trusted sources (VoltAgent
# awesome-claude-code-subagents, addyosmani agent-skills, anthropics) trigger
# PI012 (embedded_system_prompt) and PI009 (untrusted_dangerous_tool:Write/Edit/Bash)
# as warn (confidence 0.65-0.95). These are by-design patterns in legitimate
# skill bundles, not actual prompt-injection. Bulk waiver TODO: extend schema
# to support `bulk_waivers_by_source` so trusted_sources can drop PI009/PI012
# at warn level without per-skill SHA1 entries. Until then, `ultron doctor`
# will surface them as warnings — they are not blocking and can be ignored
# in routine triage.
exceptions:
