# ULTRON Intent Dispatcher -- keyword/regex routing rules
# Order matters: first match wins. Most specific patterns first.
# Schema fields:
#   id: unique rule identifier
#   match: Python regex (re.IGNORECASE applied)
#   skill: skill ID to suggest (optional)
#   agent: agent name to suggest (optional)
#   suggest_tool: tool name to suggest (optional)
#   suggest_mode: mode to suggest (optional, e.g. ULTRA)
#   ctx: context file path to load (optional, ~ expanded)
#   ztmsi_query: if true, run ZTMSI query to find best ctx at runtime
#   confidence: float 0.0-1.0 (required)
version: 1
rules:

  # ── Overlays & architecture ──────────────────────────────────────────────────

  - id: architect
    match: "(dise[n\xf1][a\xe1]|design).*(arquitectura|architecture|sistema)"
    skill: "agent-skills:plan"
    suggest_mode: "ULTRA"
    confidence: 0.95

  # ── PR / code review (must precede generic code rules) ───────────────────────

  - id: pr-code-review
    # Acepta gap pequeño entre verbo-review y PR/pull request.
    match: "(?:code review|hacer (?:un )?review|revisar|revisa|review)(?:\\s+\\w+){0,3}\\s+(?:\\bPR\\b|pull request|este PR|del PR|de este PR)"
    skill: "pr-review-toolkit:code-reviewer"
    confidence: 0.95

  # ── TDD / testing ───────────────────────────────────────────────────────────

  - id: tdd
    match: "\\bTDD\\b|(test.driven|hacer.TDD|quiero.TDD)"
    skill: "superpowers:test-driven-development"
    confidence: 0.95

  - id: tests-create
    # Verbos de creación + objeto "tests" cercano (5-30 chars). Evita "haz X y luego mira los tests" con gap enorme.
    match: "\\b(?:haz|crea|escribe|implementa)(?:me)?\\s+(?:los?|unos?)?\\s*tests?\\b"
    skill: "superpowers:test-driven-development"
    confidence: 0.90

  # ── Systematic debugging ────────────────────────────────────────────────────

  - id: systematic-debug
    # Bidireccional: "llevo X horas con bug" o "bug ... y llevo X horas".
    match: "(?:(?=.*\\bllevo\\b)(?=.*\\b(?:sesiones|horas|d[ií]as|semanas)\\b)(?=.*(?:bug|arregl|fix|fall[ao]|error|debug)))|no encuentro la causa|corr[ií]geme\\s+(?:este\\s+|el\\s+|un\\s+)?(?:bug|error)|\\bestoy atascado\\b"
    skill: "superpowers:systematic-debugging"
    confidence: 0.95

  # ── MCP builder ─────────────────────────────────────────────────────────────

  - id: mcp-builder
    # server/servidor opcional — "hacer un MCP para X" es señal suficiente.
    match: "\\b(?:crea|crear|construir|hacer|haz|implementa|desarrolla)\\b(?:\\s+\\w+){0,3}\\s+(?:un\\s+)?MCP(?:\\s+(?:server|servidor|para|de|custom|nuevo))?\\b"
    skill: "mcp-builder"
    confidence: 0.90

  # ── Database schema ─────────────────────────────────────────────────────────

  - id: db-schema
    # Acepta "crea/crear/diseña/define" + "schema" + (BD/DB/database/tabla) en cualquier orden cercano.
    match: "(?=.*\\b(?:crea|crear|dise[ñn]a|dise[ñn]ar|define|definir)\\b)(?=.*\\bschema\\b)(?=.*\\b(?:base de datos|\\bBD\\b|\\bDB\\b|database|tabla))"
    skill: "database-schema-designer"
    confidence: 0.90

  # ── Business / pricing (BEFORE UE5 — domain beats platform, T-34) ───────────

  - id: monetize
    match: "(monetiz[a\xe1]r?|c[o\xf3]mo.cobrar|c[o\xf3]mo.vender|qu[e\xe9].pricing|cu[a\xe1]nto.cobrar)"
    skill: "business-strategist"
    confidence: 0.92

  - id: saas-pricing
    match: "(pricing|suscripci[o\xf3]n|freemium|tier|plan.de.precios).*(SaaS|app|producto|negocio|plugin)"
    skill: "business-strategist"
    confidence: 0.92

  - id: business-validate
    # "validar" suelto matcheaba "validar el código / la entrada". Restringido a contexto comercial.
    match: "\\b(?:idea de negocio|modelo de negocio|mercado objetivo|\\bTAM\\b|\\bSAM\\b|validar (?:la idea|el negocio|el modelo|el producto|el pitch)|go.to.market|pitch (?:deck|investor|comercial))\\b"
    skill: "business-strategist"
    confidence: 0.88

  # ── Academic code evaluation (BEFORE generic code rules) ────────────────────

  - id: academic-grade
    match: "(corr[i\xed]geme|eval[u\xfa]a|nota|c[o\xf3]mo.est[a\xe1]).*(T\\d+|entrega|pr[a\xe1]ctica|trabajo.de)"
    skill: "repo-evaluator"
    confidence: 0.92

  - id: academic-submission
    match: "(corrige|revisa).*(entrega|proyecto).*(uni|universidad|asignatura|backend|frontend|servidor)"
    skill: "repo-evaluator"
    confidence: 0.90

  - id: academic-eval
    match: "\\b(?:dame (?:una )?nota|ponme (?:una )?nota|qu[eé] nota me pones|qu[eé] nota me das|eval[uú]a(?:r)?\\s+(?:el\\s+)?(?:c[oó]digo|trabajo)\\s+(?:como\\s+)?(?:profesor|estricto|nota))\\b"
    skill: "repo-evaluator"
    confidence: 0.90

  # ── UE5 / gamedev-engineer (domain beats generic bug/code) ──────────────────

  - id: ue5-cpp
    match: "(\\.(cpp|h|hpp)|blueprint|replicaci[o\xf3]n).*(UE5|Unreal|GAS|gameplay.ability)"
    skill: "gamedev-engineer"
    confidence: 0.95

  - id: ue5-gas
    match: "(GAS|Gameplay.Ability|ability.system|netcode|replication|dedicated.server).*(UE5|Unreal|game)"
    skill: "gamedev-engineer"
    confidence: 0.95

  - id: ue5-shader
    match: "(shader|material|PBR|post.process).*(UE5|Unreal)"
    skill: "gamedev-engineer"
    confidence: 0.90

  - id: ue5-general
    match: "\\b(UE5|Unreal.Engine|Blueprint|GameplayEffect|AbilityTask)\\b"
    skill: "gamedev-engineer"
    confidence: 0.90

  - id: ue5-gas-context
    match: "\\bGAS\\b.*(cooldown|ability|replicaci[o\xf3]n)|cooldown.*(ability|GAS)"
    skill: "gamedev-engineer"
    confidence: 0.88

  - id: ue5-game-spawn
    match: "(spawnear|spawn.*(proyectil|actor)|se.replique.*lag|actor.*replicaci[o\xf3]n)"
    skill: "gamedev-engineer"
    confidence: 0.85

  # ── CUDA / GPU / OpenGL → senior-engineer (graphics) ────────────────────────

  - id: gpu-cuda
    # GPU/CUDA en contexto técnico — evitar "ejecutar en GPU" / "tarjeta GPU" coloquial.
    # Multi-keyword exigido para nombres muy cortos.
    match: "\\b(?:CUDA|coalescing|warp|memory bandwidth|compute shader|dispatch shader|GPU (?:kernel|memoria|pipeline|shader|programaci[oó]n)|kernel (?:de )?CUDA|programar en (?:CUDA|GPU))\\b"
    skill: "senior-engineer"
    confidence: 0.92

  - id: opengl-pipeline
    match: "(OpenGL|Vulkan|DirectX|VAO|VBO|fragment.shader|vertex.shader|pipeline.de.(render|gr\xe1ficos))"
    skill: "senior-engineer"
    confidence: 0.90

  - id: cpp-deep
    match: "(C\\+\\+20|concepts|metaprogramming|template.*specializ|constexpr.*impl|SIMD|bajo.nivel)"
    skill: "senior-engineer"
    confidence: 0.88

  # ── Unity / .cs → senior-engineer (tiebreak: Unity+cs → senior-engineer, not gamedev-engineer) ─

  - id: unity-cs
    match: "(\\.cs|MonoBehaviour|NGO|NetworkObject).*(Unity|Android|iOS|mobile)"
    skill: "senior-engineer"
    confidence: 0.90

  # ── Code bugs / refactors → senior-engineer ───────────────────────────────

  - id: typescript-bug
    match: "(\\.ts|\\.tsx|TypeScript).*(bug|error|no.funciona|crash|falla)|(bug|error|crash).*\\.tsx?"
    skill: "senior-engineer"
    confidence: 0.90

  - id: code-bug-general
    # Acepta orden síntoma→objeto u objeto→síntoma. Género/número flexible.
    match: "\\b(?:(?:bug|error|crash|stack trace|exception|no funciona|est[aá] (?:roto|rota|rotos|rotas)|fall[ao])\\b\\s+(?:\\w+\\s+){0,5}(?:c[oó]digo|archivo|m[oó]dulo|funci[oó]n|clase|m[eé]todo|script)\\b|(?:el|la|los|las|este|esta|mi|un|una)\\s+(?:c[oó]digo|archivo|m[oó]dulo|funci[oó]n|clase|m[eé]todo|script)(?:\\s+\\w+){0,4}\\s+(?:est[aá] (?:roto|rota|rotos|rotas)|tiene un? (?:bug|error)|falla|crashe[ao]|no funciona|se rompe))"
    skill: "senior-engineer"
    confidence: 0.85

  - id: refactor
    match: "(refactori[sz]|reescribe|limpia|reorganiza).*(m[o\xf3]dulo|c[o\xf3]dig[o\xf3]|clase|funci[o\xf3]n)"
    skill: "senior-engineer"
    confidence: 0.85

  - id: implementa
    match: "(implementa|crea|escribe|desarrolla).*(en.TypeScript|en.Python|en.C#|server.action|api.route|endpoint)"
    skill: "senior-engineer"
    confidence: 0.82

  # ── Design / UI → ui-designer ──────────────────────────────────────────────

  - id: ui-design
    match: "(dise\xf1a|diseña|revisa|critica|mira).*(UI|pantalla|layout|wireframe|mockup|interfaz)"
    skill: "ui-designer"
    confidence: 0.90

  - id: design-system
    match: "(design.system|sistema.de.dise\xf1o|tipograf\xeda|paleta.de.colores|spacing|tokens.de.dise\xf1o)"
    skill: "ui-designer"
    confidence: 0.88

  # ── Science / concepts → research-explainer ────────────────────────────────

  - id: sky-science
    match: "por.qu[e\xe9].el.cielo.es|scattering.de.Rayleigh"
    skill: "research-explainer"
    confidence: 0.95

  - id: science-concept
    match: "(por.qu[e\xe9].el|c[o\xf3]mo.funciona.la).*(f\xedsica|qu\xedmica|bioLog\xeda|astronom\xeda|mec\xe1nica.cu\xe1ntica)"
    skill: "research-explainer"
    confidence: 0.88

  # ── Web research (before concept-explain — explicit internet intent beats generic how-it-works) ──

  - id: web-research
    match: "(investiga|busca).*(internet|online|web)"
    agent: "Explore"
    suggest_tool: "WebSearch"
    confidence: 0.90

  - id: concept-explain
    # "concepto" suelto era trampa. Lista cerrada de conceptos comunes + sin .* glotón.
    match: "\\b(?:qu[eé] es (?:un|el|la)|c[oó]mo funciona (?:un|el|la)|expl[ií]came (?:el|la|un|una))\\s+(?:\\w+\\s+){0,3}(?:transformer|red neuronal|algoritmo|protocolo|encoder|decoder|backprop|attention|gradient)\\b"
    skill: "research-explainer"
    confidence: 0.85

  # ── Repo / audit (early) ────────────────────────────────────────────────────

  - id: repo-eval-audit-early
    match: "\\b(?:repo[- ]?evaluator|audita(?:r)? (?:este )?repo)\\b"
    skill: "ultron"
    suggest_mode: "HIGH"
    confidence: 0.95

  # ── System/Windows → windows-admin ──────────────────────────────────────────

  - id: windows-system
    match: "(procesos.*(RAM|CPU|memoria)|limpiar.archivos.temporales|Windows.con.PowerShell|registro.de.Windows)"
    skill: "windows-admin"
    confidence: 0.90

  - id: process-monitor
    match: "\\b(procesos|proceso)\\b.*(comiendo|usando|consumiendo).*(RAM|CPU|memoria|disco)"
    skill: "windows-admin"
    confidence: 0.90

  # ── Generic code review (low priority — after specific rules) ───────────────

  - id: code-review-general
    match: "(rev[i\xed]s[a\xe1]|revisa|review).*\\bc[o\xf3]dig[o\xf3]\\b"
    skill: "superpowers:requesting-code-review"
    confidence: 0.85

  # ── ULTRON operations ────────────────────────────────────────────────────────

  - id: standup
    match: "(standup|stand.up|qu[e\xe9].hice|qu[e\xe9].hiciste|resumen.del.d[i\xed]a|daily)"
    skill: "ultron"
    suggest_mode: "HIGH"
    confidence: 0.90

  - id: skill-audit
    # "audita" / "auditar" sueltos matcheaban "audita el código" (eso es repo-evaluator/security).
    # Restringido a contexto skill/repo-eval.
    match: "\\b(?:audita(?:r)? (?:la skill|el skill|las skills|este skill|mi skill|el manifest)|audit(?:a|or[ií]a) de skills?|revisar skill|review skill)\\b"
    skill: "ultron"
    suggest_mode: "HIGH"
    confidence: 0.90

  - id: news-today
    match: "(noticias|newsletter|digest|qu[e\xe9].pas[o\xf3]|novedades).*(hoy|tech|ia|ai|f[u\xfa]tbol|deportes|sports)"
    skill: "ultron"
    confidence: 0.85

  - id: security-review
    # "seguridad" suelto matcheaba "seguridad de tipos" (TypeScript). Exigir contexto auditoría/pen/CVE.
    # Acepta artículo "la" entre verbo y objeto. CVE/CVEs en plural.
    match: "\\b(?:vulnerabilidad(?:es)?|CVEs?\\b|pentest(?:ing)?|penetration test|escan[ea]a(?:r)? (?:los? )?CVEs?|audit(?:a|ar|or[ií]a)?\\s+(?:la\\s+)?seguridad|audita el repo|security (?:audit|review|scan)|revisar (?:la )?seguridad)\\b"
    skill: "security-review"
    suggest_mode: "HIGH"
    confidence: 0.90

  # NOTE: las antiguas reglas con coincidencia laxa (`(gasto|finanzas|...)`) fueron retiradas
  # por falsos positivos masivos (matcheaban "gasto de tokens", "gasto computacional",
  # "presupuesto de la API"). Si reintroduces dominios personales (finanzas, narrativa, etc.)
  # en tu fork, hazlo con boundary estricto y multi-keyword AND.

  # ── Skill management ────────────────────────────────────────────────────────

  - id: skill-create
    match: "(crea|nuevo).*\\bskill\\b"
    skill: "skill-creator:skill-creator"
    confidence: 0.95

  # ── Memory recall ────────────────────────────────────────────────────────────

  - id: project-status
    match: "(c[o\xf3]mo.va|como.va|status|estado).*\\bproyecto\\b"
    ctx: "~/.ultron-vault/00_INDEX/_packets/projects-active.md"
    confidence: 0.90

  - id: decision-recall
    match: "(qu[e\xe9] decidimos|que decidimos|cu[a\xe1]l fue la decisi[o\xf3]n|qu[e\xe9] dijo)"
    ztmsi_query: true
    confidence: 0.85

  # ── v15.4.16: clusters derived from real telemetry (history.jsonl) ──────────
  # Added after analyzing 409 unmatched prompts in dispatcher-events.jsonl.
  # Each rule covers a recurring pattern the user dictates frequently.

  # Full review audit (academic + repo polish bundle) -- highest priority
  - id: review-audit
    match: "(?:full\\s+)?(?:review|kirkard|kirardo)\\b.{0,80}(?:audit|review|nota|corrige|actualiza)"
    skill: "repo-evaluator"
    suggest_mode: "HIGH"
    confidence: 0.92

  # Rebuild / update / recompile the control center
  - id: ultron-rebuild
    match: "(?:^|\\s)(?:actualiza(?:r|me)?|recompila(?:r|me)?|rebuild|hacer (?:un )?rebuild|falta (?:un )?(?:recompilar|rebuild))(?:\\s|$|[\\.,;¿!\\?])"
    skill: "ultron"
    suggest_mode: "MEDIUM"
    confidence: 0.85

  # Codex peer verification / dual mode trigger
  - id: codex-verify
    match: "\\b(?:codex\\s+verifica|verif[i\xed]calo\\s+con\\s+codex|lanza\\s+(?:modo\\s+)?(?:dual|maxdual)|valid[ao]lo\\s+con\\s+codex|dual\\s+digo)\\b"
    skill: "codex:codex-rescue"
    suggest_mode: "HIGH"
    confidence: 0.90

  # Stack trace / build error paste -> systematic-debugging
  - id: build-error-paste
    match: "(?:FAILED|AssertionError|Process completed with exit code [1-9]|NU190[12]|warning as error|API\\s+Error)\\b"
    skill: "superpowers:systematic-debugging"
    confidence: 0.85

  # "Faltan cosas / no se ha completado / falta por hacer" - incompleteness reports
  - id: incomplete-work
    match: "(?:faltan?\\s+(?:muchas?\\s+)?cosas\\b|no\\s+(?:se\\s+)?(?:ha\\s+|han\\s+)?(?:completad[oa]|terminad[oa])|sigue\\s+pendiente)"
    skill: "ultron"
    suggest_mode: "HIGH"
    confidence: 0.80

  # Diagnostic / final status request
  - id: diagnostic-final
    match: "(?:diagn[o\xf3]stico\\s+(?:final|completo)|status\\s+(?:de|del)\\s+(?:control\\s+center|sistema|instal)|estado\\s+(?:final|general)\\s+(?:de|del))"
    skill: "ultron"
    suggest_mode: "HIGH"
    confidence: 0.85

  # Memory / vault layout questions
  - id: memory-layout
    match: "(?:memoria\\s+(?:est[a\xe1]|veo|m[a\xe1]s)\\s+(?:agrupad|esparcid)|agrupad[ao]s?\\s+(?:por\\s+)?(?:grupos|v[i\xed]nculos|categor)|bolitas\\s+agrupadas)"
    skill: "ultron"
    confidence: 0.80

  # Mojibake / encoding complaints
  - id: encoding-bug
    match: "(?:ðŸ|car[a\xe1]cter(?:es)?\\s+(?:chinos?|raros?|extraños?|mal)|error\\s+de\\s+car[a\xe1]ct|mojibake|encoding\\s+(?:bug|broken)|UTF[-\\s]?(?:8|16))"
    skill: "ultron"
    confidence: 0.85

  # ── v15.5.10: review R6 #4 — top unmatched clusters ──────────────────────

  # Git ops — 13 unmatched hits in last window
  - id: git-ops
    match: "\\b(?:haz |hacer )?(?:un )?git\\s+(?:commit|push|pull|rebase|stash|merge|cherry.?pick|amend)\\b|\\b(?:commit y push|quita la desc(?:ripci[o\xf3]n)? del commit)\\b"
    skill: "commit-commands:commit"
    confidence: 0.90

  # ULTRON state questions — 69 unmatched hits
  - id: ultron-state-query
    match: "\\b(?:qu[e\xe9] falta|c[o\xf3]mo va el sistema|verifica (?:que|todo)|est[a\xe1] funcional|dame (?:lo que )?recomiend|dame diagn[o\xf3]stico|estado (?:del|de) ultron)\\b"
    skill: "ultron"
    suggest_mode: "MEDIUM"
    confidence: 0.85

  # Plan / spec / roadmap — 50 unmatched, current architect rule too narrow.
  # v15.5.11: tightened from "\\bplan ..." (matched "plan de precios del API",
  # "plan de viaje", etc.) to require a development context keyword
  # (sistema/feature/arquitectura/sprint/release/refactor/implementacion/migracion)
  # within ~30 chars OR an explicit dev term (behaviour tree, roadmap técnico).
  - id: plan-loose
    match: "\\b(?:planifica(?:r|me)?|hiper.?plan|spec(?:ifica)?)\\b.{0,40}(?:sistema|feature|arquitectura|sprint|release|refactor|implementaci[óo]n|migraci[óo]n|m[óo]dulo)|\\b(?:behaviour|behavior) tree\\b|\\broadmap (?:t[ée]cnico|del producto|de la release)\\b"
    skill: "agent-skills:plan"
    suggest_mode: "MEDIUM"
    confidence: 0.80

  # Memory / vault / sync — 34 unmatched
  - id: memory-vault-ops
    match: "\\b(?:limpi[ao]s? la memoria|vault deprecado|skills no sincronizan|memory.sync|memoria.sync|recall (?:no )?funciona)\\b"
    skill: "ultron"
    confidence: 0.80

  # ── v15.5.15: opt-in personal personas (5) ─────────────────────────────────
  # These 5 skills live in ~/.claude/skills/ but were absent from the
  # dispatcher YAML; measured as a structural cap on match-rate (~50% of
  # prompts went to source=none). All five activate via Claude's skill
  # auto-trigger from the SKILL.md description; adding regex rules here
  # lets the dispatcher route them BEFORE Claude reads any skill, cutting
  # latency and recovering the no-route bucket.

  # Casual code-quality check ("mira si esto está bien", "está bien este código?")
  # Distinct from pr-code-review (which requires the literal "PR" / "pull request").
  - id: casual-code-review
    match: "\\b(?:mira|revisa|chec(?:a|k)|qu[e\xe9] te parece)\\b(?:\\s+(?:si|este|esto|esa|esa))?\\s+(?:est[ae]?\\s+)?(?:c[o\xf3]digo|implementaci[o\xf3]n|funci[o\xf3]n|m[o\xf3]dulo|clase)(?:\\s+est[a\xe1]\\s+(?:bien|ok|correcto|mal))?"
    skill: "superpowers:requesting-code-review"
    confidence: 0.85

  # Lost-where-to-start debug signal ("el sistema está roto y no sé por dónde
  # empezar"). Distinct from systematic-debug (which keys on "llevo X horas").
  - id: debug-lost
    match: "\\b(?:(?:el\\s+)?sistema\\s+(?:est[a\xe1]\\s+)?(?:roto|fallando|broken)|todo\\s+(?:est[a\xe1]\\s+)?(?:roto|fallando))\\b.{0,40}\\b(?:no\\s+s[e\xe9]|no\\s+entiendo|d[o\xf3]nde\\s+empezar|por\\s+d[o\xf3]nde)\\b"
    skill: "superpowers:systematic-debugging"
    suggest_mode: "HIGH"
    confidence: 0.92

  # tio-gilito: personal finance (Scrooge McDuck-style budget assistant)
  - id: tio-gilito
    match: "\\b(?:t[ií]o\\s+gilito|gilito|cu[a\xe1]nto\\s+(?:he\\s+gastad[ao]|me\\s+queda)|mis\\s+(?:finanzas|ahorros|gastos)|presupuesto\\s+mensual|saldo\\s+actual|a[nñ]ade?\\s+(?:un\\s+)?(?:gasto|ingreso)|c[o\xf3]mo\\s+voy\\s+de\\s+dinero|an[a\xe1]lisis\\s+financiero|despilfarr|abre\\s+el\\s+dashboard\\s+(?:de\\s+)?(?:finanzas|gastos))\\b"
    skill: "tio-gilito"
    confidence: 0.92

  # warren: investment advisor (long-term portfolio)
  - id: warren
    match: "\\b(?:warren|c[o\xf3]mo\\s+va\\s+mi\\s+cartera|qu[e\xe9]\\s+(?:compro|vendo)\\b|an[a\xe1]lisis\\s+fundamental|qu[e\xe9]\\s+(?:ETF|acci[o\xf3]n|fondo)|rentabilidad\\s+(?:anual|hist[o\xf3]rica)|dividendos|(?:mi|la)\\s+cartera|invertir\\s+en|m[a\xe1]cro\\s+(?:econ[o\xf3]mica|mercado))\\b"
    skill: "warren"
    confidence: 0.90

  # tolkien: book/narrative writer ("Imperio de los Once Grandes" universe)
  - id: tolkien
    match: "\\b(?:tolkien|modo\\s+escritor|escribe\\s+el\\s+(?:libro|cap[ií]tulo|siguiente)|contin[u\xfa]a\\s+(?:el\\s+)?(?:libro|cap[ií]tulo)|escribe\\s+la\\s+escena|revisa\\s+el\\s+cap[ií]tulo|plot\\s+hole|consistencia\\s+narrativa|arco\\s+(?:del?\\s+)?(?:personaje|trama)|once\\s+grandes|imperio\\s+de\\s+los?\\s+once)\\b"
