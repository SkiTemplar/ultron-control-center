[package]
name = "control-center"
version = "2.7.1"
description = "ULTRON Control Center - desktop control panel for the ULTRON system"
authors = ["USER SURNAME"]
edition = "2021"

[lib]
name = "control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CLI sidecar used by session-recall-inject.js to compute BGE-small embeddings
# without requiring the full Tauri runtime. Build with:
#   cargo build --release --bin ultron-embed --features qdrant
[[bin]]
name = "ultron-embed"
path = "src/bin/ultron_embed.rs"
required-features = ["qdrant"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
walkdir = "2"
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
once_cell = "1"
portable-pty = "0.9.0"
base64 = "0.22.1"
sysinfo = "0.31"
which = "6"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = { version = "2", features = ["deflate"] }
# Qdrant semantic recall (optional — enable with --features qdrant).
# fastembed provides ONNX-based BGE-small-EN-v1.5 (384-d) locally, no API key.
fastembed = { version = "4", optional = true }

[dev-dependencies]
tempfile = "3"
mockall = "0.13"

[features]
default = []
hybrid_recall = []
# Enable local Qdrant semantic recall. Pulls in fastembed (ONNX runtime +
# BGE-small-EN-v1.5, ~22 MB download on first use). Off by default so CI
# and normal builds stay lean. Enable with: cargo build --features qdrant
qdrant = ["dep:fastembed"]

[target."cfg(windows)".dependencies]
wmi = "0.13"
