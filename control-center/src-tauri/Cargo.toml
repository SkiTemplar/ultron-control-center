[package]
name = "control-center"
version = "2.7.1"
description = "ULTRON Control Center - desktop control panel for the ULTRON system"
authors = ["USER SURNAME"]
edition = "2021"

[lib]
name = "control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# CLI sidecar used by session-recall-inject.js to compute BGE-small embeddings
# without requiring the full Tauri runtime. Build with:
#   cargo build --release --bin ultron-embed --features qdrant
[[bin]]
name = "ultron-embed"
path = "src/bin/ultron_embed.rs"
required-features = ["qdrant"]

# Memory/orchestrator CLI sidecar invoked by the Claude Code hooks (Node) so the
# hooks reuse the canonical Rust logic instead of duplicating it in JS.
#   cargo build --release --bin ultron-memory --features qdrant
[[bin]]
name = "ultron-memory"
path = "src/bin/ultron_memory.rs"
required-features = ["qdrant"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
walkdir = "2"
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
once_cell = "1"
portable-pty = "0.9.0"
base64 = "0.22.1"
sysinfo = "0.31"
which = "6"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", features = ["deflate"] }
# Load .env files at startup so users can store provider API keys in
# ~/.ultron/.env or ~/.ultron/control-center/.env without exporting to shell.
dotenvy = "0.15"
# Explicit tokio dependency so commands can use tokio::time::timeout directly.
# The `time` feature is already enabled transitively (via reqwest/tauri) but
# rustc requires a direct declaration to reference `tokio::` in crate code.
tokio = { version = "1", features = ["time"] }
# Structured, app-wide observability (cat15). `tracing` macros replace the
# ad-hoc eprintln! logging in startup/error paths; `tracing-subscriber` with
# the env-filter feature honours RUST_LOG and is initialised once per binary
# (the GUI in lib.rs::run() and each sidecar's main).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Qdrant semantic recall (optional — enable with --features qdrant).
# fastembed provides ONNX-based BGE-small-EN-v1.5 (384-d) locally, no API key.
fastembed = { version = "4", optional = true }

[dev-dependencies]
tempfile = "3"
mockall = "0.13"

[features]
# Enable local Qdrant semantic recall by default so embeddings use real
# vectors instead of the zero-stub (BGE-small 384d for embed(), E5-large
# 1024d ~2.2 GB for embed_e5(), the canonical recall embedder). fastembed
# downloads the ONNX models on first use into the canonical cache
# ULTRON_FASTEMBED_CACHE (default ~/.ultron/.fastembed_cache/).
# Disable for CI lean builds: cargo check --no-default-features
default = ["qdrant"]
hybrid_recall = []
# Enable local Qdrant semantic recall. Pulls in fastembed (ONNX runtime +
# BGE-small-EN-v1.5, ~22 MB download on first use).
qdrant = ["dep:fastembed"]
# Enable the Finance tab (reads the local KutxaBank finanzas.db).
# finance.rs is excluded from the public repo via .gitignore; this feature
# flag keeps the binary buildable without that file present.
finance = []

[target."cfg(windows)".dependencies]
wmi = "0.13"

# ---------------------------------------------------------------------------
# CI-tuned test profile (applies to `cargo test` and `cargo clippy --profile
# test`, which share artefacts). Goal: trim the codegen+link of the local
# crate on Windows-MSVC without losing coverage or weakening the gate. The
# desktop build (build:local) uses profile `release`, so it is unaffected.
# ---------------------------------------------------------------------------
[profile.test]
# debug = 0: emit no .pdb. On Windows-MSVC writing the PDB is the single most
# expensive I/O of the link step. Verified safe: 0 tests assert on backtraces,
# install panic hooks, or use #[should_panic] — panic *messages* are unaffected.
debug = 0
# incremental = false: in CI (clean tree + restored cache) incremental gives no
# benefit and only bloats the Swatinem cache / muddies the fingerprint.
incremental = false
# codegen-units = 16: the default 256 emits 256 objects the MSVC linker must
# resolve; 16 cuts linker work while keeping rustc parallelism reasonable on
# the ~4-core windows-latest runner. Do NOT drop to 1 (kills codegen
# parallelism). If a hot run regresses, raise to 32 or remove this line.
codegen-units = 16
