[project]
name = "ultron"
version = "15.5.17"
requires-python = ">=3.12"
dependencies = [
    "bashlex>=0.18",
    "jsonschema>=4.26",
    "pytest>=9.0",
    "pyyaml>=6.0",
    "rich>=15.0",
    "textual>=8.0",
    "tiktoken>=0.12",
    # v14.6 PERFECT MEMORY
    "qdrant-client>=1.10",
    "sentence-transformers>=3.0",
    # v14.8 ULTRA POLISH — fast ONNX embeddings for hook query path
    "fastembed>=0.3,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "routing: tests for the prompt → persona/skill router (intent-dispatcher, fast-path, fallbacks)",
    "layer1: smoke tests for L1 personas (terry-davis, don-claudio, mike-tyson, etc.) — keep fast",
    "tiebreak: routing tiebreaker rules (domain beats platform, more-specific wins)",
    "plugins: routes for plugin-namespaced skills (codex:*, superpowers:*, etc.)",
    "combos: combined-signal routing (file ext + verb + persona)",
    "confidence: confidence-band assertions",
    "manual: contract tests skipped in CI; run manually with --runmanual",
]
