# Qdrant native config — points at the same bind-mount the Docker container
# used (~/.ultron/qdrant_storage). Datos existentes (392 MB) se cargan tal cual.
#
# ULTRON v15.0.2 - native fallback when Docker WSL2 backend is broken.

storage:
  # Storage path resolved relative to qdrant.exe working directory. We launch
  # from this dir, so use absolute Windows path style understood by qdrant.
  storage_path: C:\Users\USER\.ultron\qdrant_storage
  snapshots_path: C:\Users\USER\.ultron\qdrant_storage\snapshots

  performance:
    # Conservative thread count — leave plenty for the rest of ULTRON / games.
    max_search_threads: 0  # 0 = auto, half of CPU cores

service:
  http_port: 6333
  grpc_port: 6334
  host: 127.0.0.1
  enable_cors: true

telemetry_disabled: true

log_level: INFO
